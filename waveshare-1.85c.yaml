# ---------------------------------------------------------------
# waveshare-1.85c.yaml
#
# LumaDeck consumer YAML for the Waveshare ESP32-S3-Touch-LCD-1.85C
# (BOX speaker + 3.7V Li battery variant).
#
#   Product: https://www.waveshare.com/esp32-s3-touch-lcd-1.85c.htm
#   Wiki:    https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-1.85C
#
# Hardware highlights:
#   * 1.85" 360x360 round AMOLED, ST77916 over QSPI
#   * CST816 capacitive touch over I2C
#   * TCA9554PWR I2C GPIO expander (LCD_RST=EXIO2, TP_RST=EXIO1)
#   * PCM5101 I2S DAC + 4Ω 5W speaker (BOX variant)
#   * PCF85063 RTC, QMI8658 IMU, microphone, TF slot (not wired here)
#
# IMPORTANT — first-light status:
# As of ESPHome 2026.04, ST77916 is NOT a built-in qspi_dbi model
# (https://github.com/esphome/feature-requests/issues/2803), so we
# use `model: CUSTOM` with a hand-transcribed `init_sequence:`.
#
# Source of truth for everything board-specific (init bytes, polarity,
# pin numbering, SPI clock, color order) is Waveshare's own
# Arduino/ESP-IDF reference firmware, vendored as a submodule at:
#   references/waveshare-esp32-s3-touch-lcd-1.85c/
# See `references/README.md` for which files matter.
#
# Specifically: the init bytes below come from
#   Arduino/examples/01_lvgl_example/Display_ST77916.cpp ::
#     vendor_specific_init_new[]
# (NOT from Espressif's generic `vendor_specific_init_default[]`).
# Waveshare's panel ships in at least two revisions and they detect
# which by reading chip register 0x04 at boot. ESPHome can't do
# runtime detection from YAML, so we pick the newer-revision
# sequence -- which is what any board manufactured 2025+ uses.
# ---------------------------------------------------------------

substitutions:
  device_name:      "waveshare_round"
  device_friendly:  "Waveshare 1.85 Round"
  ha_media_player:  "media_player.living_room"
  # Bumped to DEBUG during first-light bring-up so the boot log shows
  # PSRAM init, the I2C device scan (we need to see 0x20 for the
  # TCA9554), the qspi_dbi init bytes, and LVGL framebuffer alloc.
  # Drop back to INFO once the panel lights up.
  log_level:        "DEBUG"
  # Pin substitutions consumed by lumadeck/packages/{backlight,audio}.yaml
  backlight_pin:    "GPIO5"
  audio_dout_pin:   "GPIO47"

packages:
  core:      !include lumadeck/packages/core.yaml
  board:     !include lumadeck/packages/board_esp32s3.yaml
  theme:     !include lumadeck/themes/dark.yaml
  fonts:     !include lumadeck/packages/fonts.yaml
  colors:    !include lumadeck/packages/colors.yaml
  display:   !include lumadeck/packages/display.yaml
  ha:        !include lumadeck/packages/ha.yaml
  nav:       !include lumadeck/packages/nav.yaml
  touch:     !include lumadeck/packages/touch.yaml
  backlight: !include lumadeck/packages/backlight.yaml
  audio:     !include lumadeck/packages/audio.yaml
  layout:    !include lumadeck/layouts/round_360.yaml
  status:    !include lumadeck/widgets/status_bar.yaml
  clock:     !include lumadeck/widgets/clock.yaml
  navtabs:   !include lumadeck/widgets/nav_tabs.yaml
  # media: TEMPORARILY DISABLED for first-light debug. The media_card
  # widget subscribes to multiple HA media_player state attributes;
  # when wifi/API come up, HA pushes state which triggers a flurry
  # of `lvgl.label.update` / `lvgl.slider.update` actions. Each one
  # makes LVGL flush via qspi_dbi to the ST77916. If the panel isn't
  # responding (which is consistent with the screen being blank),
  # the SPI/DMA flush hangs the main loop -- exactly matching the
  # observed freeze-after-wifi-connect symptom. Re-enable once the
  # display is verified to be talking to us.
  # media:     !include lumadeck/widgets/media_card.yaml
  toast:     !include lumadeck/widgets/notification_toast.yaml
  chime:     !include lumadeck/widgets/notification_sound.yaml

# ---- hardware (lives in this consumer repo, not in LumaDeck) ----

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
  variant: ESP32S3

# The Waveshare 1.85C wires its USB-C port directly to the ESP32-S3's
# built-in USB-Serial/JTAG peripheral (GPIO19/20) -- there is NO
# CH340/CP2102 bridge on the board. Default ESPHome logging targets
# UART0 (GPIO43/44, side header only), which means nothing reaches
# the USB-C cable. Override the logger to route over the JTAG/CDC
# device so `make waveshare-logs` actually shows boot output.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: ${log_level}

# 8MB octal PSRAM — required for the 360x360 LVGL framebuffer.
psram:
  mode: octal
  speed: 80MHz

# Single I2C bus shared by the TCA9554 expander, CST816 touch,
# PCF85063 RTC, and any future expander-side peripherals. Per the
# Waveshare wiki SCL/SDA on this board are dedicated I2C pins and
# cannot be remapped to GPIO.
i2c:
  - id: bus_a
    sda: GPIO11
    scl: GPIO10
    frequency: 400kHz
    scan: true

# TCA9554PWR GPIO expander. Drives the panel reset (EXIO2) and touch
# reset (EXIO1) lines. SD card CS (EXIO3) and RTC INT (EXIO4) are
# present on the bus but not wired here.
#
# ESPHome's `pca9554` platform handles both PCA9554 and TCA9554
# (identical command interface) -- there is no separate `tca9554:`
# component as of ESPHome 2026.04.
pca9554:
  - id: lum_io_expander
    address: 0x20
    i2c_id: bus_a

# QSPI bus for the ST77916 AMOLED.
spi:
  - id: lcd_qspi
    type: quad
    clk_pin: GPIO40
    data_pins:
      - GPIO46    # D0 / SDA0
      - GPIO45    # D1 / SDA1
      - GPIO42    # D2 / SDA2
      - GPIO41    # D3 / SDA3

display:
  - platform: qspi_dbi
    id: lum_display
    model: CUSTOM
    spi_id: lcd_qspi
    cs_pin: GPIO21
    # LCD_RST is on EXIO2 of the TCA9554 — not a GPIO. ESPHome's
    # qspi_dbi will toggle it through the expander (the pca9554
    # platform covers TCA9554 too).
    reset_pin:
      pca9554: lum_io_expander
      number: 2
      mode:
        output: true
      inverted: true
    dimensions:
      width: 360
      height: 360
    # Color order RGB and 80 MHz pclk both lifted from
    # references/.../Display_ST77916.{cpp,h}:
    #   .rgb_ele_order = LCD_RGB_ELEMENT_ORDER_RGB;
    #   ESP_PANEL_LCD_SPI_CLK_HZ = 80 * 1000 * 1000;
    color_order: rgb
    invert_colors: false
    data_rate: 80MHz
    auto_clear_enabled: false
    update_interval: never
    # ----------------------------------------------------------
    # Vendor-specific init sequence for ST77916, lifted verbatim
    # from Waveshare's own working Arduino reference firmware:
    #   references/waveshare-esp32-s3-touch-lcd-1.85c/
    #     Arduino/examples/01_lvgl_example/Display_ST77916.cpp
    #   :: vendor_specific_init_new[]
    #
    # Their code reads chip register 0x04 at boot to pick between
    # this sequence and Espressif's `vendor_specific_init_default[]`.
    # We can't probe at YAML config-time, so we pick this one --
    # it's the sequence for the panel revision shipping in 2025+
    # boards, which is what we have. Each `- [CMD, ...DATA]`
    # corresponds to one `{cmd, data, size, delay_ms}` struct entry;
    # non-zero delay_ms entries become a `- delay <n>ms` line.
    # ----------------------------------------------------------
    init_sequence:
      - [0xF0, 0x28]
      - [0xF2, 0x28]
      - [0x73, 0xF0]
      - [0x7C, 0xD1]
      - [0x83, 0xE0]
