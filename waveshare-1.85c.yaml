# Backlight + I2S speaker sink are now supplied by:
#   lumadeck/packages/backlight.yaml  (consumes ${backlight_pin})
#   lumadeck/packages/audio.yaml      (consumes ${audio_dout_pin})
# See substitutions block at the top of this file.

# Bind the display to LVGL. The 360x360 panel is square so no
# rotation is needed (round_360 layout assumes this orientation).
lvgl:
  displays:
    - lum_display

touchscreen:
  - platform: cst816
    id: lum_touchscreen
    i2c_id: bus_a
    interrupt_pin: GPIO4
    # TP_RST is also on the TCA9554 (EXIO1).
    reset_pin:
      pca9554: lum_io_expander
      number: 1
      mode:
        output: true
      inverted: true
    on_touch:
      - script.execute:
          id: lum_touch_press
          x: !lambda 'return touch.x;'
          y: !lambda 'return touch.y;'
    on_update:
      - if:
          condition:
            lambda: 'return !touches.empty();'
          then:
            - script.execute:
                id: lum_touch_update
                x: !lambda 'return touches[0].x;'
                y: !lambda 'return touches[0].y;'
    on_release:
      - script.execute: lum_touch_release

# Boot button doubles as manual page-cycle, matching the LilyGo build.
# During first-light bring-up it ALSO fires the chime, so we have an
# audible signal that's independent of the display: if the screen is
# black but pressing GPIO0 makes the speaker beep, we know the device
# booted, the I2C bus came up, and component setup completed -- the
# bug is then narrowly in display land. Drop the `lum_notify_chime`
# action once the panel is lit.
binary_sensor:
  - platform: gpio
    id: lum_boot_btn
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - logger.log: "[boot_btn] pressed -> nav_next_page + lum_notify_chime"
      - script.execute: nav_next_page
      - script.execute: lum_notify_chime

# I2S audio bus (PCM5101 DAC). The `speaker:` sink (id `lum_speaker`)
# is supplied by lumadeck/packages/audio.yaml; we only declare the
# bus + pin map here, same split LumaDeck uses for `i2c:` / `spi:`.
# Pins from the Waveshare wiki:
#   Speak_DIN  = GPIO47   (audio_dout_pin substitution)
#   Speak_LRCK = GPIO38
#   Speak_BCK  = GPIO48
i2s_audio:
  - id: lum_i2s
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48

# Power-amplifier ENABLE pin on GPIO15. Without this driven HIGH, the
# PCM5101 will output audio fine but the analog amp downstream is in
# shutdown -- you'll see ESPHome log "Started -> Stopped" on the
# speaker but hear NOTHING. Discovered from Waveshare's reference
# firmware:
#   references/.../ESP-IDF/.../main/Audio_Driver/Audio_Driver.c
#   :: Audio_PA_EN() / Audio_PA_DIS()
# Their code keeps it LOW at boot and toggles HIGH just before each
# play; we leave it ALWAYS_ON for simplicity since there's nothing
# else competing for power on GPIO15. Pulse-mute it later if power
# draw matters for battery operation.
switch:
  - platform: gpio
    pin: GPIO15
    id: lum_audio_pa_enable
    name: "${device_friendly} Audio Amp"
    restore_mode: ALWAYS_ON

# Periodic heartbeat -- fires every 1s during first-light debug so we
# can pinpoint within ~1 second when (and if) the main loop wedges.
# Bump back to 5s once first-light works.
interval:
  - interval: 1s
    then:
      - logger.log:
          level: INFO
          format: "[heartbeat] uptime=%us  free_heap=%uKB  api=%s"
          args:
            - "(unsigned)(millis() / 1000)"
            - "(unsigned)(esp_get_free_heap_size() / 1024)"
            - 'api_is_connected() ? "UP" : "down"'

# First-light heartbeat: every successful boot fires the chime once,
# at the very end of setup (after wifi/api/components are all up).
# If you hear a beep, the device is alive even when the panel is
# black -- isolates display issues from system-wide failures.
# Remove (or set priority back to 600+) once the panel is lit.
esphome:
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - logger.log: "[on_boot] firing boot chime now -- listen for a beep"
      - script.execute: lum_notify_chime
      - delay: 200ms
      - logger.log: "[on_boot] boot chime done; if you didn't hear it, the PA enable on GPIO15 isn't working"

# Instrumented wifi.on_connect to pinpoint the hang.
# We saw: heartbeats fire 1Hz from uptime=4..14s, then wifi connects,
# then SILENCE -- no uptime=15s heartbeat. Something fires once
# wifi-connect completes and wedges the main loop. These delayed log
# lines, combined with the 1s heartbeat, will narrow the window:
#   * If we see all 5 callback logs AND heartbeats keep coming after
#     -> hang is in some other component triggered after on_connect
#   * If we see N callback logs then nothing -> hang is between
#     callback step N and N+1
#   * If we see 0 callback logs -> hang fires before on_connect runs
wifi:
  on_connect:
    - logger.log: "[wifi.on_connect T+0ms] entered callback"
    - delay: 50ms
    - logger.log: "[wifi.on_connect T+50ms] still alive"
    - delay: 200ms
    - logger.log: "[wifi.on_connect T+250ms] still alive"
    - delay: 1s
    - logger.log: "[wifi.on_connect T+1250ms] still alive"
    - delay: 2s
    - logger.log: "[wifi.on_connect T+3250ms] still alive"
  on_disconnect:
    - logger.log: "[wifi.on_disconnect] fired"
